name: "Infra · Equipo (consume el pipeline central)"
run-name: "Infra equipo · ${{ github.base_ref || github.ref_name }} (${{ github.event_name }})"

# Este repo NO tiene lógica de pipeline propia: llama a los workflows
# reutilizables de germannylezama-pragma/github-actions-benefits.
# Mismas reglas que el repo central:
#   dev → dev · main → prod (solo análisis) · deploy/dev, deploy/prod → análisis + deploy
# Cambiar @main por @<otra-rama> prueba una versión nueva del pipeline sin tocar este repo.

on:
  pull_request:
    branches: [dev, main, "deploy/**"]
    paths: ["terraform/**", ".github/workflows/**"]
  push:
    branches: [dev, main, "deploy/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  contexto:
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-contexto.yml@main
    with:
      presupuestos: '{"dev":50,"prod":200}' # este equipo solo tiene dev y prod

  analizar:
    name: "Análisis · ${{ needs.contexto.outputs.environment }}"
    needs: contexto
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-infra-scan.yml@main
    with:
      environment: ${{ needs.contexto.outputs.environment }}
      tf_dir: terraform
      budget: ${{ fromJSON(needs.contexto.outputs.budget) }}
    secrets: inherit

  deploy:
    name: "Deploy · ${{ needs.contexto.outputs.environment }}"
    needs: [contexto, analizar]
    if: needs.contexto.outputs.deploy == 'true'
    permissions:
      contents: read
      id-token: write
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-deploy.yml@main
    with:
      environment: ${{ needs.contexto.outputs.environment }}
      tf_dir: terraform
    secrets: inherit
