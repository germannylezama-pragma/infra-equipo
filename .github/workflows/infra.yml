name: "Infra · Equipo (consume el pipeline central)"

# Este repo NO tiene lógica de pipeline propia: reutiliza el workflow de
# germannylezama-pragma/github-actions-benefits con `uses:`.
# Cambiar @main por @<otra-rama> prueba una versión nueva del pipeline sin tocar este repo.

on:
  pull_request:
    paths: ["terraform/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["terraform/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analizar:
    name: "Análisis · ${{ matrix.environment }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: dev
            budget: 50
          - environment: prod
            budget: 200
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-infra-scan.yml@main
    with:
      environment: ${{ matrix.environment }}
      tf_dir: terraform
      budget: ${{ matrix.budget }}
    secrets: inherit
