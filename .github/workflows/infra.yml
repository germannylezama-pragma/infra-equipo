name: "Infra · Equipo (consume el pipeline central)"
run-name: "Infra equipo · ${{ github.base_ref || github.ref_name }} (${{ github.event_name }})"

# Este repo NO tiene lógica de pipeline propia: llama a los workflows
# reutilizables de germannylezama-pragma/github-actions-benefits.
#   dev → dev · cert → cert · main → prod (solo análisis) · deploy/<amb> → análisis + deploy
#
# VERSIONES DEL PIPELINE:
#   dev y prod usan @main (estable).
#   cert usa @feature/comentario-costo: la versión en prueba que comenta el costo en el PR.
#   Cuando cert la apruebe, se hace merge en el repo central y dev/prod la reciben solos.
# `uses:` no acepta variables, por eso hay dos jobs de análisis y un `if` elige cuál corre.

on:
  pull_request:
    branches: [dev, cert, main, "deploy/**"]
    paths: ["terraform/**", ".github/workflows/**"]
  push:
    branches: [dev, cert, main, "deploy/**"]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  contexto:
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-contexto.yml@main
    with:
      ambientes: "dev cert prod"

  analizar:
    name: "Análisis · ${{ needs.contexto.outputs.environment }} · @main"
    needs: contexto
    if: needs.contexto.outputs.environment != 'cert'
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-infra-scan.yml@main
    with:
      environment: ${{ needs.contexto.outputs.environment }}
      tf_dir: terraform
    secrets: inherit

  analizar-cert:
    name: "Análisis · cert · @feature/comentario-costo (en prueba)"
    needs: contexto
    if: needs.contexto.outputs.environment == 'cert'
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-infra-scan.yml@feature/comentario-costo
    with:
      environment: cert
      tf_dir: terraform
    secrets: inherit

  deploy:
    name: "Deploy · ${{ needs.contexto.outputs.environment }}"
    needs: [contexto, analizar, analizar-cert]
    # corre si el análisis que tocaba (uno de los dos) pasó
    if: >-
      always() && needs.contexto.outputs.deploy == 'true' &&
      (needs.analizar.result == 'success' || needs.analizar-cert.result == 'success')
    permissions:
      contents: read
      id-token: write
    uses: germannylezama-pragma/github-actions-benefits/.github/workflows/reusable-deploy.yml@main
    with:
      environment: ${{ needs.contexto.outputs.environment }}
      tf_dir: terraform
    secrets: inherit
